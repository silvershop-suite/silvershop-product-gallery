# Re-opens the shared Product type (declared in silvershop-suite/api-graphql's _graphql/types.yml) to add the
# `gallery` and `media` fields. REUSES the overlay's existing ShopImage type (id/url/alt/width/height) — NOT redefined
# here. SilverShop\Api\Enrichment\GalleryProductEnrichment emits $data['gallery'] as rows of {id, url, alt} (images
# only), a subset of ShopImage's fields; width/height resolve to null for gallery rows, which is fine as all fields
# are nullable. Only read when the overlay is installed (see _config/graphql.yml guard).

# Adds Product.gallery (images, rides the api module's GalleryProductEnrichment) and Product.media (the video-aware
# superset, rides this module's GalleryMediaProductEnrichment — $data['media']). Both reuse the overlay's ShopImage
# for images/posters. silverstripe/graphql merges these fields into the single Product type (Type::mergeWith).
Product:
  fields:
    gallery: '[ShopImage]'
    media: '[GalleryMedia]'

# One row of SilverShop\ProductGallery\Enrichment\GalleryMediaProductEnrichment ($data['media']). `kind` is
# image|video_embed|video_file; `image` is set on image rows, `embedSrc`/`poster`/`consentCategory` on video_embed
# rows. `embedSrc` is the already-normalised privacy embed (youtube-nocookie / Vimeo ?dnt=1); `consentCategory` is the
# cookieconsent category to grant before loading it (null for first-party images). All nullable.
GalleryMedia:
  fields:
    kind: String
    image: ShopImage
    embedSrc: String
    poster: ShopImage
    consentCategory: String
